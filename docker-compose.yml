services:
  backend:
    build:
      context: ./apps/backend/
      dockerfile: Dockerfile
    env_file:
      - apps/backend/.env
    ports:
      - 5001:5001
    restart: unless-stopped
    volumes:
      - ./apps/backend/data:/app/data
      - ./apps/backend/logs:/app/logs
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('localhost', 5001), 3)"
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - llama

  llama:
    build:
      context: ./apps/llama
      dockerfile: Dockerfile
    cap_add:
      - SYS_RESOURCE
    environment:
      MODEL_URL: "https://huggingface.co/MaziyarPanahi/Llama-3-8B-Instruct-64k-GGUF/resolve/main/Llama-3-8B-Instruct-64k.Q4_K_M.gguf"
      MODEL_PATH: "/models/Llama-3-8B-Instruct-64k.Q4_K_M.gguf"
      # MODEL_SHA256: ""  # optional integrity check
    command: ["--model", "/models/Llama-3-8B-Instruct-64k.Q4_K_M.gguf", "--host", "0.0.0.0", "--port", "3000"]
    ports:
      - 3000:3000/tcp
    volumes:
      - ./apps/llama/models:/models
