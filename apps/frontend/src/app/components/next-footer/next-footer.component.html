<footer class="z-20 w-screen p-3 bg-white/80 backdrop-blur md:p-6 flex justify-between text-slate-900 border-t border-slate-200">
  <button class="border-2 p-1 px-4 rounded-full disabled:text-slate-400 disabled:border-slate-300
            hover:bg-slate-100 transition-colors"
          [disabled]="destinationService.isPreviousDisabled()"
          (click)="destinationService.previous()">
    <i class="fa-solid fa-arrow-left"></i>
  </button>

  <button class="border-2 p-1 px-4 rounded-full hover:bg-slate-100 transition-colors"
        (click)="destinationService.next()">
    <i class="fa-solid fa-arrow-right"></i>
  </button>
</footer>
